name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Older Ubuntu = older glibc, so the binary runs on more distros (Pop!_OS 22.04/24.04+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/cosmic-mousetrap dist/cosmic-mousetrap-x86_64-linux
          (cd dist && sha256sum cosmic-mousetrap-x86_64-linux > cosmic-mousetrap-x86_64-linux.sha256)
          mkdir -p pkg/cosmic-mousetrap/systemd
          cp dist/cosmic-mousetrap-x86_64-linux pkg/cosmic-mousetrap/cosmic-mousetrap
          cp install.sh uninstall.sh README.md LICENSE-MIT LICENSE-APACHE pkg/cosmic-mousetrap/
          cp systemd/cosmic-mousetrap.service pkg/cosmic-mousetrap/systemd/
          if [ -d assets ]; then cp -r assets pkg/cosmic-mousetrap/; fi
          tar -C pkg -czf dist/cosmic-mousetrap-${GITHUB_REF_NAME}-x86_64-linux.tar.gz cosmic-mousetrap

      - name: Fetch voice pack asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p "cosmic-mousetrap-glados-voice.tar.gz" -D dist/ || echo "Voice pack asset not found from prior release"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
